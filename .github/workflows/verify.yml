name: Verify app and member authentication
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build 2>&1 | tee /tmp/healthycash-check-build.log
      - run: npm run test:server 2>&1 | tee /tmp/healthycash-check-server.log
      - run: npm run test:functions 2>&1 | tee /tmp/healthycash-check-functions.log
      - run: npm test 2>&1 | tee /tmp/healthycash-check-demo.log
      - run: npm run test:auth 2>&1 | tee /tmp/healthycash-check-auth.log
        if: ${{ !cancelled() }}
      - name: Publish verification summary
        if: always()
        run: |
          python3 - <<'PY'
          import os, html
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## Verification output\nNo production credentials are used in these tests.\n')
            for path in sorted(Path('/tmp').glob('healthycash-check-*.log')):
              text = '\n'.join(path.read_text(errors='replace').splitlines()[-130:])[-20000:]
              summary.write('<details open><summary>' + path.stem + '</summary><pre>' + html.escape(text) + '</pre></details>\n')
          PY
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-failure-traces
          path: test-results/
          retention-days: 7
